version: '3.8'
services:

  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: banking-co-efficient-app
    container_name: banking-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/banking_co_efficient
    volumes:
      - ./:/var/www/banking_co_efficient
      - ./docker-compose/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: banking-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - pdf-service
    networks:
      - app-network

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: banking-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: banking_co_eff
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./docker-compose/mysql:/var/lib/mysql
    networks:
      - app-network

  # Redis Service
  # redis:
  #   image: redis:alpine
  #   container_name: banking-redis
  #   restart: unless-stopped
  #   tty: true
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: banking-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - app-network

  # Python PDF Service
  pdf-service:
    build:
      context: ./pdf_service
      dockerfile: Dockerfile
    image: banking-co-efficient-pdf
    container_name: banking-pdf-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
